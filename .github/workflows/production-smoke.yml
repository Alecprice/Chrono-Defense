name: Production Smoke

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrono-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical production matches current main
        env:
          CHRONO_EXPECT_COMMIT: ${{ github.sha }}
          CHRONO_SMOKE_ATTEMPTS: '12'
          CHRONO_SMOKE_DELAY_MS: '10000'
        run: node scripts/smoke-production.mjs
