name: Temporary Adaptive Assist
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Temporarily wire adaptive retry')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch battle engines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patches = {
            'src/components/StoneAgeBattleV3.jsx': [
              ("import { checkpointMatches, clearBattleCheckpoint, saveBattleCheckpoint } from '../core/battleCheckpoint.js';", "import { checkpointMatches, clearBattleCheckpoint, saveBattleCheckpoint } from '../core/battleCheckpoint.js';\nimport { applyAdaptiveAssist } from '../core/adaptiveAssist.js';"),
              ("let units = buildWave({ mapNumber, waveNumber: waveRef.current, mode });", "let units = applyAdaptiveAssist('stone-age', mapNumber, buildWave({ mapNumber, waveNumber: waveRef.current, mode }));"),
            ],
            'src/components/RetroBattleV2.jsx': [
              ("import React,{useEffect,useMemo,useRef,useState}from'react';", "import React,{useEffect,useMemo,useRef,useState}from'react';import{applyAdaptiveAssist}from'../core/adaptiveAssist.js';"),
              ("const units=buildRetroWave({mapNumber,waveNumber:waveRef.current});", "const units=applyAdaptiveAssist('retro',mapNumber,buildRetroWave({mapNumber,waveNumber:waveRef.current}));"),
            ],
            'src/components/FutureBattleV2.jsx': [
              ("import React,{useEffect,useMemo,useRef,useState}from'react';", "import React,{useEffect,useMemo,useRef,useState}from'react';\nimport{applyAdaptiveAssist}from'../core/adaptiveAssist.js';"),
              ("const units=buildFutureWave({mapNumber,waveNumber:waveRef.current});", "const units=applyAdaptiveAssist('future',mapNumber,buildFutureWave({mapNumber,waveNumber:waveRef.current}));"),
            ],
            'src/components/SpaceBattleV2.jsx': [
              ("import React,{useEffect,useMemo,useRef,useState}from'react';", "import React,{useEffect,useMemo,useRef,useState}from'react';import{applyAdaptiveAssist}from'../core/adaptiveAssist.js';"),
              ("const units=buildSpaceWave({mapNumber,waveNumber:waveRef.current});", "const units=applyAdaptiveAssist('space',mapNumber,buildSpaceWave({mapNumber,waveNumber:waveRef.current}));"),
            ],
            'src/components/TimeRiftBattleV2.jsx': [
              ("import React,{useEffect,useMemo,useRef,useState}from'react';", "import React,{useEffect,useMemo,useRef,useState}from'react';import{applyAdaptiveAssist}from'../core/adaptiveAssist.js';"),
              ("const units=buildRiftWave({mapNumber,waveNumber:waveRef.current});", "const units=applyAdaptiveAssist('time-rift',mapNumber,buildRiftWave({mapNumber,waveNumber:waveRef.current}));"),
            ],
          }
          for filename, replacements in patches.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements:
                  if new in text:
                      continue
                  if old not in text:
                      raise SystemExit(f'Missing patch target in {filename}: {old[:80]}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - run: npm install
      - run: npm run build
      - run: test -f dist/precache-manifest.json
      - name: Commit battle integration
        run: |
          git config user.name "Alec Price"
          git config user.email "52548136+Alecprice@users.noreply.github.com"
          git add src/components/StoneAgeBattleV3.jsx src/components/RetroBattleV2.jsx src/components/FutureBattleV2.jsx src/components/SpaceBattleV2.jsx src/components/TimeRiftBattleV2.jsx
          git commit -m "Wire adaptive easier retry into every era"
          git fetch origin main
          git rebase origin/main
          git push origin main
