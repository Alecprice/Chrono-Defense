name: Apply Battle Resume Patch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Harden checkpoint finalization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/StoneAgeBattleV3.jsx')
          s=p.read_text()
          s=s.replace("      if (status === 'won' || status === 'lost') return;", "      if (finalizedRef.current || status === 'won' || status === 'lost') return;")
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run build
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StoneAgeBattleV3.jsx
          if ! git diff --cached --quiet; then
            git commit -m "Harden battle checkpoint cleanup"
            git push
          fi
